[package]
name = "axolotl"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
workspace-core = { path = "../workspace-core" }
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-component = "=0.5.1"
wry = { version = "=0.55.1", features = ["transparent"] }
anyhow = "1"
base64 = "0.22"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[features]
smoke = []

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-authentication-services = { version = "=0.3.2", default-features = false, features = ["std", "ASAuthorizationWebBrowserPublicKeyCredentialManager", "block2"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString", "CFNumber"] }
objc2-security = { version = "0.3", default-features = false, features = ["std", "SecTask"] }
objc2 = "0.6"
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CALayer"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWorkspace", "NSEvent", "NSGraphicsContext", "block2", "NSAppearance", "NSBitmapImageRep", "NSImageRep", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSURL", "NSDictionary", "NSData", "NSError", "NSNotification", "NSOperation", "NSString", "block2"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKSnapshotConfiguration", "WKWebView", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell"] }
