<!doctype html>
<meta charset="utf-8">
<style>
:root{color-scheme:light dark;--ink:light-dark(#20252c,#eef0f5)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#grip{position:absolute;bottom:0;right:0;width:26px;height:18px;padding:1px 3px;border:0;border-radius:5px 0 9px 0;background:transparent;color:light-dark(#89919e,#a0a9b8);cursor:nwse-resize;touch-action:none;user-select:none;display:flex;align-items:center;justify-content:flex-end;transition:color .12s}
#grip:hover,#grip:focus-visible,#grip:active{color:var(--ink)}#grip svg{width:14px;height:14px;pointer-events:none}
</style>
<button id="grip" title="Drag to resize popup" aria-label="Resize popup">__HEROICON_arrows-pointing-out__</button>
<script>
const grip=document.querySelector('#grip');
let state={},resize=null;
const send=(type,extra={})=>window.ipc.postMessage(JSON.stringify({type,...extra,generation:state.generation}));
window.updatePins=s=>{if(state.generation!==s.generation)resize=null;state=s};
grip.onpointerdown=e=>{if(e.button!==0||!state.rect)return;resize={x:e.screenX,y:e.screenY,w:state.rect.width,h:state.rect.height};send('resize-start');grip.setPointerCapture(e.pointerId);e.preventDefault()};
// Screen coordinates stay stable when the native corner overlay moves during resizing.
grip.onpointermove=e=>{if(resize)send('resize',{width:Math.max(240,resize.w+e.screenX-resize.x),height:Math.max(160,resize.h+e.screenY-resize.y)})};
grip.onpointerup=grip.onlostpointercapture=()=>resize=null;
document.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();send('dismiss')}};
send('ready');
</script>
