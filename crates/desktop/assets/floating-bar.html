<!doctype html><meta charset="utf-8" /><style>
  :root {
    color-scheme: light dark;
    --surface: rgba(243, 245, 247, 0.8);
    --border: #c9d2dc;
    --ink: #243240;
    --muted: #647487;
    --active: #d8eee6;
    --accent: #228668;
    --hover: #dae2e9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: rgba(37, 48, 61, 0.8);
      --border: #465366;
      --ink: #dde5ed;
      --muted: #a4b1c0;
      --active: #294c43;
      --accent: #66c9ac;
      --hover: #3a4859;
    }
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font:
      12px -apple-system,
      Segoe UI,
      sans-serif;
    color: var(--ink);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
  }
  #bar {
    display: flex;
    align-items: center;
    gap: 4px;
    position: relative;
    width: 160px;
    max-width: 100%;
    flex-shrink: 0;
    opacity: 0.5;
    transition:
      width 240ms cubic-bezier(0.2, 0.8, 0.2, 1),
      opacity 160ms ease;
    padding: 4px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--surface);
    box-shadow: 0 3px 8px #0003;
    user-select: none;
    touch-action: pan-y;
  }
  #bar:hover,
  #bar.editing {
    opacity: 1;
  }
  button {
    color: inherit;
    font: inherit;
    border: 0;
    background: transparent;
    cursor: pointer;
    border-radius: 12px;
    height: 28px;
    flex-shrink: 0;
  }
  button:hover {
    background: var(--hover);
  }
  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  #handle,
  #add, #shield {
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    padding: 0;
    border-radius: 50%;
    line-height: 1;
  }
  #shield .shield-off-mark, #shield .shield-pending { display: none; }
  #shield[data-protection-state="off"] .shield-outline { display: none; }
  #shield[data-protection-state="off"] .shield-off-mark { display: block; }
  #shield[data-protection-state="pending"] .shield-outline { display: none; }
  #shield[data-protection-state="pending"] .shield-pending { display: block; }
  .close, .arrow { display: inline-flex; align-items: center; justify-content: center; }
  .close svg { width: 14px; height: 14px; }
  .sleep-icon { display: inline-flex; margin-right: 4px; opacity: .5; }
  #handle {
    cursor: grab;
  }
  #handle svg,
  #add svg,
  #shield svg {
    display: block;
    pointer-events: none;
  }
  .notification-badge {
    display: inline-flex;
    flex: 0 0 auto;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 18px;
    padding: 0 4px;
    border-radius: 999px;
    background: #d71932;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    line-height: 18px;
    font-variant-numeric: tabular-nums;
  }
  #count {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    position: absolute;
    left: 36px;
    /* Reserve both trailing controls so the count cannot cover the shield. */
    right: 68px;
    min-width: 0;
    opacity: 1;
    transition: opacity 140ms ease;
    font-variant-numeric: tabular-nums;
  }
  #tabs {
    display: flex;
    flex: 1;
    gap: 4px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition:
      opacity 180ms ease,
      visibility 0s linear 180ms;
    overflow-x: auto;
    scrollbar-width: none;
    min-width: 0;
  }
  #tabs::-webkit-scrollbar {
    display: none;
  }
  #bar.expanded {
    width: var(--expanded-width, 100%);
  }
  .expanded #tabs {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition-delay: 50ms, 0s;
  }
  .expanded #count {
    opacity: 0;
    pointer-events: none;
  }
  .arrow {
    width: 0;
    padding: 0;
    opacity: 0;
    visibility: hidden;
    overflow: hidden;
    pointer-events: none;
    transition:
      width 180ms ease,
      opacity 180ms ease,
      visibility 0s linear 180ms;
  }
  .expanded.overflow .arrow {
    width: 22px;
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition-delay: 0s;
  }
  #tabs {
    --fade-left: 0px;
    --fade-right: 0px;
    -webkit-mask-image: linear-gradient(
      to right,
      transparent,
      #000 var(--fade-left),
      #000 calc(100% - var(--fade-right)),
      transparent
    );
    mask-image: linear-gradient(
      to right,
      transparent,
      #000 var(--fade-left),
      #000 calc(100% - var(--fade-right)),
      transparent
    );
  }
  .expanded.fade-left #tabs {
    --fade-left: 18px;
  }
  .expanded.fade-right #tabs {
    --fade-right: 18px;
  }
  @media (prefers-reduced-motion: reduce) {
    #bar,
    #tabs,
    #count,
    .arrow {
      transition: none;
    }
  }
  .chip {
    display: flex;
    align-items: center;
    gap: 5px;
    flex: 0 0 172px;
    height: 28px;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0 4px 0 8px;
    cursor: pointer;
    min-width: 0;
  }
  .chip.active {
    background: var(--active);
    border-color: var(--accent);
  }
  .label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .chip img {
    width: 14px;
    height: 14px;
    object-fit: contain;
  }
  .close {
    width: 22px;
    font-size: 16px;
    padding: 0;
  }
  .chip.editing {
    flex-basis: 320px;
    max-width: 100%;
  }
  input {
    width: 100%;
    min-width: 0;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    user-select: text;
  }
  body.menu {
    align-items: flex-end;
    padding-bottom: 5px;
  }
  body.menu #bar {
    opacity: 1;
  }
  #menu {
    position: fixed;
    bottom: 52px;
    width: 188px;
    padding: 4px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    backdrop-filter: blur(16px);
    box-shadow: 0 4px 14px #0004;
    z-index: 10;
  }
  #menu[hidden] {
    display: none;
  }
  #menu button {
    display: block;
    width: 100%;
    height: 28px;
    padding: 0 10px;
    border-radius: 8px;
    text-align: left;
  }
  #menu button:disabled {
    opacity: 0.4;
    cursor: default;
    background: transparent;
  }
  #menu hr {
    height: 1px;
    margin: 4px 2px;
    border: 0;
    background: var(--border);
  }
  .slot {
    border-left: 3px solid var(--accent) !important;
  }
  .dragging {
    cursor: grabbing !important;
  }
</style>
<div id="bar" role="toolbar" aria-label="Panel tabs">
  <button
    id="handle"
    title="Drag panel to merge or split"
    aria-label="Drag panel"
  >__HEROICON_bars-3__</button
  ><button id="count" title="Show tabs" aria-label="Show tabs"></button
  ><button class="arrow" id="prev" aria-label="Scroll tabs left">__HEROICON_chevron-left__</button>
  <div id="tabs" role="tablist"></div>
  <button class="arrow" id="next" aria-label="Scroll tabs right">__HEROICON_chevron-right__</button
  ><button id="shield" aria-label="Website protection" title="Website protection" style="color:var(--accent)"><span class="shield-outline">__HEROICON_shield-check__</span><span class="shield-off-mark">__HEROICON_shield-exclamation__</span><span class="shield-pending">__HEROICON_arrow-path__</span></button><button id="add" title="New tab (⌘/Ctrl+T)" aria-label="New tab">__HEROICON_plus__
  </button>
</div>
<div id="menu" role="menu" hidden></div>
<style>
body.history{align-items:flex-end}#history{position:absolute;bottom:52px;left:4px;right:4px;max-height:calc(100% - 56px);overflow:auto;border:1px solid var(--border);border-radius:10px;background:light-dark(#f3f5f7,#25303d);box-shadow:0 3px 8px #0003}
#history button{display:block;width:100%;padding:8px 12px;text-align:left;border:0;border-radius:0;background:transparent;height:auto;cursor:pointer}#history button:hover,#history button[aria-selected=true]{background:var(--hover)}#history strong,#history span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#history span{opacity:.65;margin-top:3px}#history strong{font-weight:550}
</style><div id="history" role="listbox" aria-label="Browsing history" hidden></div>
<script>
  __HISTORY_SCRIPT__;
  __FLOATING_SCRIPT__;
</script>
