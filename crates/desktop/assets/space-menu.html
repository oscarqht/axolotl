<!doctype html>
<meta charset="utf-8">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font:13px -apple-system,Segoe UI,sans-serif;color:var(--ink)}
#menu{position:absolute;width:220px;max-width:calc(100vw - 8px);max-height:calc(100vh - 8px);overflow:auto;padding:5px;border:1px solid var(--border);border-radius:8px;background:var(--surface);box-shadow:0 4px 14px #0003}
#menu.editing{width:320px}
button{padding:8px 12px;text-align:left;border:0;border-radius:4px;background:transparent;color:inherit;font:inherit;cursor:pointer}button:hover,button:focus-visible{background:var(--hover);outline:2px solid var(--border)}
#edit-space{display:block;width:100%}form{margin:0;padding:7px}h2{font-size:14px;margin:0 0 14px}label{display:block;margin-bottom:7px}input{width:100%;min-width:0;padding:7px;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:4px;font:inherit}small{display:block;margin-top:7px;font-size:11px;opacity:.7}
.fields{display:flex;gap:8px;align-items:center}#icon{flex-shrink:0;width:38px;height:34px;padding:4px;text-align:center;border:1px solid var(--border);font-size:20px}#icon.empty{font-size:18px}.actions{display:flex;justify-content:flex-end;margin-top:12px}#save{background:var(--hover);border:1px solid var(--border)}
#picker{margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}.picker-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.picker-heading label{margin:0}#clear{padding:4px 8px}#emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));max-height:180px;overflow:auto;margin-top:8px;gap:2px}#emojis button{padding:4px 0;height:34px;text-align:center;font-size:22px}#emojis button[aria-pressed=true]{background:var(--hover)}#empty{padding:10px 0;margin:0;opacity:.7}[hidden]{display:none!important}
</style>
<div id="menu" role="menu" aria-label="Space tab">
<button id="edit-space" role="menuitem">Edit space</button>
<form hidden>
<h2>Edit space</h2><label for="title">Space title</label>
<div class="fields"><button id="icon" type="button" aria-label="Choose space icon" aria-expanded="false" aria-controls="picker"></button><input id="title" autocomplete="off"></div>
<small>Leave empty to use the page title</small>
<section id="picker" aria-label="Emoji picker" hidden>
<div class="picker-heading"><label for="search">Choose an emoji</label><button id="clear" type="button">Clear</button></div>
<input id="search" type="search" placeholder="Search emoji…" autocomplete="off">
<div id="emojis" role="group" aria-label="Emoji results"></div><p id="empty" hidden>No emoji found</p>
</section>
<div class="actions"><button id="save" type="submit">Save</button></div><small>Enter to save · Esc to cancel</small>
</form></div>
<script>
const state=window.spaceMenuState, menu=document.querySelector('#menu'), button=document.querySelector('#edit-space'), form=document.querySelector('form'), input=document.querySelector('#title');
const iconButton=document.querySelector('#icon'), picker=document.querySelector('#picker'), search=document.querySelector('#search'), emojis=document.querySelector('#emojis');
let icon=state.icon||null, finished=false;
const send=(type,value)=>{if(type!=='ready'){if(finished)return;finished=true}window.ipc.postMessage(JSON.stringify({type,value,icon}))};
for(const key of ['ink','surface','hover','border'])document.documentElement.style.setProperty('--'+key,state[key]);
function place(){menu.style.left=Math.max(4,Math.min(state.x,innerWidth-menu.offsetWidth-4))+'px';menu.style.top=Math.max(4,Math.min(state.y,innerHeight-menu.offsetHeight-4))+'px'}
function updateIcon(){iconButton.textContent=icon||'☺';iconButton.classList.toggle('empty',!icon);iconButton.setAttribute('aria-label',icon?'Change space icon '+icon:'Choose space icon (none selected)')}
function closePicker(){picker.hidden=true;iconButton.setAttribute('aria-expanded','false');place();iconButton.focus()}
function renderEmojis(){
 const words=search.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
 const results=window.spaceEmojiData.filter(([emoji,name])=>words.every(word=>(emoji+' '+name).toLowerCase().includes(word)));
 emojis.replaceChildren(...results.map(([emoji,name])=>{const b=document.createElement('button');b.type='button';b.textContent=emoji;b.title=name;b.setAttribute('aria-label',name);b.setAttribute('aria-pressed',String(icon===emoji));b.onclick=()=>{icon=emoji;updateIcon();closePicker()};return b}));
 document.querySelector('#empty').hidden=results.length>0;emojis.scrollTop=0;place();
}
button.onclick=()=>{button.hidden=true;form.hidden=false;menu.classList.add('editing');menu.setAttribute('role','dialog');menu.setAttribute('aria-label','Edit space');input.value=state.title;input.placeholder=state.placeholder;updateIcon();place();input.focus();input.select()};
iconButton.onclick=()=>{if(!picker.hidden){closePicker();return}picker.hidden=false;iconButton.setAttribute('aria-expanded','true');search.value='';renderEmojis();search.focus()};
search.oninput=renderEmojis;
document.querySelector('#clear').onclick=()=>{icon=null;updateIcon();closePicker()};
form.onsubmit=e=>{e.preventDefault();send('save',input.value)};
document.addEventListener('pointerdown',e=>{if(!menu.contains(e.target))send('dismiss')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();send('dismiss')}else if(!form.hidden&&e.key==='Enter'&&!e.isComposing&&e.target.tagName!=='BUTTON'){e.preventDefault();form.requestSubmit()}else if(form.hidden&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();button.focus()}else if(e.key==='Tab'){const items=[...menu.querySelectorAll('button,input')].filter(el=>el.getClientRects().length);const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('resize',place);place();button.focus();send('ready');
</script>
