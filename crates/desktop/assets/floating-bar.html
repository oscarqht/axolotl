<!doctype html><meta charset="utf-8" /><style>
  :root {
    color-scheme: light dark;
    --surface: #f3f5f7;
    --border: #c9d2dc;
    --ink: #243240;
    --muted: #647487;
    --active: #d8eee6;
    --accent: #228668;
    --hover: #dae2e9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #25303d;
      --border: #465366;
      --ink: #dde5ed;
      --muted: #a4b1c0;
      --active: #294c43;
      --accent: #66c9ac;
      --hover: #3a4859;
    }
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font:
      12px -apple-system,
      Segoe UI,
      sans-serif;
    color: var(--ink);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
  }
  #bar {
    display: flex;
    align-items: center;
    gap: 4px;
    max-width: 100%;
    padding: 4px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--surface);
    box-shadow: 0 3px 8px #0003;
    user-select: none;
    touch-action: pan-y;
  }
  button {
    color: inherit;
    font: inherit;
    border: 0;
    background: transparent;
    cursor: pointer;
    border-radius: 12px;
    height: 28px;
    flex-shrink: 0;
  }
  button:hover {
    background: var(--hover);
  }
  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  #handle {
    cursor: grab;
    width: 24px;
    font-size: 18px;
  }
  #add {
    width: 28px;
    font-size: 22px;
  }
  #count {
    min-width: 48px;
    font-variant-numeric: tabular-nums;
  }
  #tabs {
    display: none;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    min-width: 0;
  }
  #tabs::-webkit-scrollbar {
    display: none;
  }
  .expanded #tabs {
    display: flex;
  }
  .expanded #count {
    display: none;
  }
  .arrow {
    display: none;
    width: 22px;
  }
  .expanded.overflow .arrow {
    display: block;
  }
  .chip {
    display: flex;
    align-items: center;
    gap: 5px;
    flex: 0 0 172px;
    height: 28px;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0 4px 0 8px;
    cursor: pointer;
    min-width: 0;
  }
  .chip.active {
    background: var(--active);
    border-color: var(--accent);
  }
  .label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .chip img {
    width: 14px;
    height: 14px;
    object-fit: contain;
  }
  .close {
    width: 22px;
    font-size: 16px;
    padding: 0;
  }
  .chip.editing {
    flex-basis: 320px;
    max-width: 100%;
  }
  input {
    width: 100%;
    min-width: 0;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    user-select: text;
  }
  .slot {
    border-left: 3px solid var(--accent) !important;
  }
  .dragging {
    cursor: grabbing !important;
    opacity: 0.65;
  }
</style>
<div id="bar" role="toolbar" aria-label="Panel tabs">
  <button
    id="handle"
    title="Drag panel to merge or split"
    aria-label="Drag panel"
  >
    ⠿</button
  ><button id="count" title="Show tabs" aria-label="Show tabs"></button
  ><button class="arrow" id="prev" aria-label="Scroll tabs left">‹</button>
  <div id="tabs" role="tablist"></div>
  <button class="arrow" id="next" aria-label="Scroll tabs right">›</button
  ><button id="add" title="New tab (⌘/Ctrl+T)" aria-label="New tab">+</button>
</div>
<script>__FLOATING_SCRIPT__</script>
