<!doctype html><meta charset="utf-8">
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font:13px -apple-system,Segoe UI,sans-serif}#frame{position:absolute;border:1px solid light-dark(#d5d8df,#515865);border-radius:10px;background:light-dark(#fff,#252a33);box-shadow:0 5px 22px #0005}#grip{position:absolute;bottom:0;left:0;width:24px;height:16px;cursor:nesw-resize;touch-action:none;color:light-dark(#777,#aaa);text-align:center;user-select:none}#menu{position:absolute;right:8px;top:4px;width:250px;max-width:calc(100vw - 16px);max-height:calc(100vh - 8px);overflow:auto;padding:5px;border:1px solid light-dark(#d5d8df,#515865);border-radius:8px;background:light-dark(#fff,#252a33);box-shadow:0 4px 16px #0004}button{width:100%;display:flex;gap:10px;align-items:center;padding:9px;border:0;border-radius:5px;color:inherit;background:transparent;text-align:left;font:inherit;cursor:pointer}button:hover,button:focus-visible{background:light-dark(#eef0f5,#3d4554)}img{width:16px;height:16px}span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}[hidden]{display:none!important}
</style>
<div id="frame" hidden><div id="grip" title="Drag to resize popup" role="separator" aria-label="Resize popup">◢</div></div><div id="menu" hidden role="menu" aria-label="Pinned tabs"></div>
<script>
const frame=document.querySelector('#frame'),menu=document.querySelector('#menu'),grip=document.querySelector('#grip');let state={},resize=null;
const send=(type,extra={})=>window.ipc.postMessage(JSON.stringify({type,...extra}));
window.updatePins=s=>{state=s;frame.hidden=!s.rect;menu.hidden=!s.menu;if(s.rect)Object.assign(frame.style,{left:s.rect.x+'px',top:s.rect.y+'px',width:s.rect.width+'px',height:s.rect.height+'px'});menu.replaceChildren();if(s.menu){if(s.unpin){const b=document.createElement('button');b.textContent='Unpin to focused pane';b.onclick=()=>send('unpin');menu.append(b)}else for(const pin of s.pins){const b=document.createElement('button'),label=document.createElement('span'),img=document.createElement('img');label.textContent=pin.title||pin.url||'New tab';try{const u=new URL(pin.url);if(/^https?:$/.test(u.protocol))img.src=u.origin+'/favicon.ico'}catch{}img.onerror=()=>img.hidden=true;b.append(img,label);b.setAttribute('role','menuitem');b.onclick=()=>send('open',{id:pin.id});b.oncontextmenu=e=>{e.preventDefault();send('context',{id:pin.id})};menu.append(b)}}};
document.onpointerdown=e=>{if(e.target===grip){resize={x:e.clientX,y:e.clientY,w:state.rect.width,h:state.rect.height};grip.setPointerCapture(e.pointerId);e.preventDefault()}else if(!menu.contains(e.target))send('dismiss')};
grip.onpointermove=e=>{if(resize)send('resize',{width:Math.max(240,resize.w+resize.x-e.clientX),height:Math.max(160,resize.h+e.clientY-resize.y)})};grip.onpointerup=grip.onlostpointercapture=()=>resize=null;
document.onkeydown=e=>{if(e.key==='Escape')send('dismiss')};document.oncontextmenu=e=>e.preventDefault();window.addEventListener('resize',()=>{});send('ready');
</script>
