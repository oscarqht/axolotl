[package]
name = "axolotl"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sha2 = { version = "0.10", optional = true }
async-channel = "2"
futures-lite = "2"
workspace-core = { path = "../workspace-core" }
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-component = "=0.5.1"
wry = { version = "=0.55.1", features = ["transparent"] }
anyhow = "1"
dirs = "6"
adblock = { version = "=0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "content-blocking"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2"
rusqlite = { version = "0.38", features = ["bundled"] }
base64 = "0.22"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[features]
smoke = ["dep:sha2"]

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
block2 = "0.6"
objc2-authentication-services = { version = "=0.3.2", default-features = false, features = ["std", "ASAuthorizationWebBrowserPublicKeyCredentialManager", "block2"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString", "CFNumber"] }
objc2-security = { version = "0.3", default-features = false, features = ["std", "SecTask"] }
objc2 = "0.6"
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CALayer", "CABase", "CAAnimation", "CAMediaTiming", "CAMediaTimingFunction"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAlert", "NSTextField", "NSButton", "NSControl", "NSWorkspace", "NSAccessibility", "NSEvent", "NSGraphicsContext", "block2", "NSAppearance", "NSBitmapImageRep", "NSImageRep", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProgress", "NSURLResponse", "NSURLRequest", "NSBundle", "NSURL", "NSDictionary", "NSData", "NSError", "NSNotification", "NSOperation", "NSString", "NSValue", "block2"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKFrameInfo", "WKSecurityOrigin", "WKDownload", "WKDownloadDelegate", "WKNavigationDelegate", "WKNavigationAction", "WKNavigationResponse", "WKSnapshotConfiguration", "WKWebView", "block2", "WKContentRuleList", "WKContentRuleListStore", "WKUserContentController", "WKUserScript", "WKWebViewConfiguration"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
