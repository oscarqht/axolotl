<!doctype html>
<meta charset="utf-8">
<style>
:root{color-scheme:light dark;--ink:light-dark(#20252c,#eef0f5);--surface:light-dark(#fff,#252a33);--border:light-dark(#d5d8df,#515865);--hover:light-dark(#eef0f5,#3d4554)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font:13px -apple-system,Segoe UI,sans-serif;color:var(--ink)}
#frame{position:absolute;border:1px solid var(--border);border-radius:10px;background:var(--surface);box-shadow:0 5px 22px #0005}
#menu{position:absolute;right:8px;top:4px;width:250px;max-width:calc(100vw - 16px);max-height:calc(100vh - 8px);overflow:auto;padding:5px;border:1px solid var(--border);border-radius:8px;background:var(--surface);box-shadow:0 4px 16px #0004}#menu.editing{width:320px}
button{border:0;border-radius:4px;background:transparent;color:inherit;font:inherit;cursor:pointer}button:hover,button:focus-visible{background:var(--hover);outline:2px solid var(--border)}.menu-item{width:100%;display:flex;gap:10px;align-items:center;padding:9px;text-align:left}img{width:16px;height:16px}.pin-emoji{width:16px;font-size:18px}.pin-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
form{margin:0;padding:7px}h2{font-size:14px;margin:0 0 14px}label{display:block;margin-bottom:7px}input{width:100%;min-width:0;padding:7px;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:4px;font:inherit}small{display:block;margin-top:7px;font-size:11px;opacity:.7}
.fields{display:flex;gap:8px;align-items:center}#icon{flex-shrink:0;width:38px;height:34px;padding:4px;text-align:center;border:1px solid var(--border);font-size:20px}#icon.empty{font-size:18px}.actions{display:flex;justify-content:flex-end;margin-top:12px}#save{padding:8px 12px;background:var(--hover);border:1px solid var(--border)}
#picker{margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}.picker-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.picker-heading label{margin:0}#clear{padding:4px 8px}#emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));max-height:180px;overflow:auto;margin-top:8px;gap:2px}#emojis button{padding:4px 0;height:34px;text-align:center;font-size:22px}#emojis button[aria-pressed=true]{background:var(--hover)}#empty{padding:10px 0;margin:0;opacity:.7}[hidden]{display:none!important}
</style>
<div id="frame" hidden></div>
<div id="menu" hidden role="menu" aria-label="Pinned tabs"></div>
<script>
const frame=document.querySelector('#frame'),menu=document.querySelector('#menu');
let state={},editing=false,icon=null,menuKey='';
const send=(type,extra={})=>window.ipc.postMessage(JSON.stringify({type,...extra,generation:state.generation}));
function updateIcon(){const button=menu.querySelector('#icon');button.textContent=icon||'';if(!icon)button.innerHTML='__ICON_emoji-talking-happy__';button.classList.toggle('empty',!icon);button.setAttribute('aria-label',icon?'Change pinned tab icon '+icon:'Choose pinned tab icon (using favicon)')}
function closePicker(){const picker=menu.querySelector('#picker'),button=menu.querySelector('#icon');picker.hidden=true;button.setAttribute('aria-expanded','false');button.focus()}
// Match Edit space's catalog, search, selected state, clear and empty-results UI.
function renderEmojis(){
 const search=menu.querySelector('#search'),emojis=menu.querySelector('#emojis');
 const words=search.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
 const results=window.spaceEmojiData.filter(([emoji,name])=>words.every(word=>(emoji+' '+name).toLowerCase().includes(word)));
 emojis.replaceChildren(...results.map(([emoji,name])=>{const b=document.createElement('button');b.type='button';b.textContent=emoji;b.title=name;b.setAttribute('aria-label',name);b.setAttribute('aria-pressed',String(icon===emoji));b.onclick=()=>{icon=emoji;updateIcon();closePicker()};return b}));
 menu.querySelector('#empty').hidden=results.length>0;emojis.scrollTop=0;
}
function editIcon(){
 editing=true;icon=state.pins.find(p=>p.id===state.unpin)?.icon||null;menu.classList.add('editing');menu.setAttribute('role','dialog');menu.setAttribute('aria-label','Edit pinned tab icon');
 menu.innerHTML='<form><h2>Edit pinned tab icon</h2><div class="fields"><button id="icon" type="button" aria-label="Choose pinned tab icon" aria-expanded="true" aria-controls="picker"></button><span>Emoji or page favicon</span></div><small>Clear the emoji to use the page favicon.</small><section id="picker" aria-label="Emoji picker"><div class="picker-heading"><label for="search">Choose an emoji</label><button id="clear" type="button">Clear</button></div><input id="search" type="search" placeholder="Search emoji…" autocomplete="off"><div id="emojis" role="group" aria-label="Emoji results"></div><p id="empty" hidden>No emoji found</p></section><div class="actions"><button id="save" type="submit">Save</button></div><small>Enter to save · Esc to cancel</small></form>';
 const search=menu.querySelector('#search'),picker=menu.querySelector('#picker'),button=menu.querySelector('#icon');
 button.onclick=()=>{if(!picker.hidden){closePicker();return}picker.hidden=false;button.setAttribute('aria-expanded','true');search.value='';renderEmojis();search.focus()};
 search.oninput=renderEmojis;menu.querySelector('#clear').onclick=()=>{icon=null;updateIcon();closePicker()};
 menu.querySelector('form').onsubmit=e=>{e.preventDefault();send('set-icon',{icon})};updateIcon();renderEmojis();search.focus();
}
function addItem(label,action){const b=document.createElement('button');b.className='menu-item';b.textContent=label;b.setAttribute('role','menuitem');b.onclick=action;menu.append(b);return b}
window.updatePins=s=>{
 const previous=state;state=s;frame.hidden=!s.rect;menu.hidden=!s.menu;
 if(previous.generation!==s.generation){editing=false;menuKey='';}
 if(s.rect)Object.assign(frame.style,{left:s.rect.x+'px',top:s.rect.y+'px',width:s.rect.width+'px',height:s.rect.height+'px'});
 if(editing&&s.menu&&previous.unpin===s.unpin)return;
 const key=JSON.stringify([s.menu,s.unpin,s.keepAlive,s.pins]);if(key===menuKey)return;menuKey=key;editing=false;menu.classList.remove('editing');menu.setAttribute('role','menu');menu.setAttribute('aria-label','Pinned tabs');menu.replaceChildren();
 if(!s.menu)return;
 if(s.unpin){
  addItem('Recover Tab…',()=>send('recover'));
  addItem('Sleep Tab',()=>send('sleep'));
  const keepAlive=addItem('Keep Alive',()=>send('keep-alive'));if(s.keepAlive)keepAlive.insertAdjacentHTML('afterbegin','__ICON_check__');keepAlive.setAttribute('role','menuitemcheckbox');keepAlive.setAttribute('aria-checked',String(s.keepAlive));
  addItem('Unpin to focused pane',()=>send('unpin'));addItem('Edit icon…',editIcon)
 }
 else for(const pin of s.pins){const b=addItem('',()=>send('open',{id:pin.id})),label=document.createElement('span');label.className='pin-title';label.textContent=(pin.title||pin.url||'New tab');label.style.opacity=pin.sleeping?'0.5':'1';
 if(pin.icon){const emoji=document.createElement('span');emoji.className='pin-emoji';emoji.textContent=pin.icon;b.append(emoji)}else{const image=document.createElement('img');try{const u=new URL(pin.url);if(/^https?:$/.test(u.protocol))image.src=u.origin+'/favicon.ico'}catch{}image.onerror=()=>image.hidden=true;b.append(image)}
 if(pin.sleeping)b.insertAdjacentHTML('beforeend','__ICON_half-moon__');b.append(label);b.setAttribute('aria-label',(pin.sleeping?'Sleeping, ':'')+(pin.title||pin.url||'New tab'));b.onmouseenter=e=>send('sleep-hover',{id:pin.id,value:true,x:e.clientX,y:e.clientY});b.onmouseleave=()=>send('sleep-hover',{id:pin.id,value:false});b.oncontextmenu=e=>{e.preventDefault();send('context',{id:pin.id})};
 }
};
document.onpointerdown=e=>{if(!menu.contains(e.target))send('dismiss')};
document.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();send('dismiss')}else if(editing&&e.key==='Enter'&&!e.isComposing&&e.target.tagName!=='BUTTON'){e.preventDefault();menu.querySelector('form').requestSubmit()}else if(e.key==='Tab'&&state.menu){const items=[...menu.querySelectorAll('button,input')].filter(el=>el.getClientRects().length),first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}};
document.oncontextmenu=e=>e.preventDefault();send('ready');
</script>
