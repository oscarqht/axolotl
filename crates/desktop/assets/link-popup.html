<!doctype html><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:13px -apple-system,BlinkMacSystemFont,sans-serif}body{background:#0006}#panel{position:absolute;overflow:hidden;border-radius:12px;background:var(--surface,#f4f4f4);color:var(--ink,#222);box-shadow:0 16px 64px #0007}header{height:44px;display:flex;align-items:center;gap:12px;padding:0 12px}#title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}button{font:inherit;color:inherit;background:transparent;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}button:hover{background:#8883}#close{font-size:20px}
</style><section id="panel" role="dialog" aria-label="Link preview"><header><span id="title">Link preview</span><button id="promote">Open in new tab</button><button id="close" aria-label="Close preview">__HEROICON_x-mark__</button></header></section><script>
const send = value => window.ipc.postMessage(value);
window.updatePopup = s => { const p=document.querySelector('#panel');Object.assign(p.style,{left:s.x+'px',top:s.y+'px',width:s.width+'px',height:s.height+'px'});p.style.setProperty('--surface',s.surface);p.style.setProperty('--ink',s.ink);const t=document.querySelector('#title');t.textContent=s.title||s.url;t.title=s.url; };
document.querySelector('#close').onclick=()=>send('dismiss');document.querySelector('#promote').onclick=()=>send('promote');document.addEventListener('click',e=>{if(e.target===document.body||e.target===document.documentElement)send('dismiss')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();send('dismiss')}if((e.metaKey||e.ctrlKey)&&!e.altKey&&e.key.toLowerCase()==='t'){e.preventDefault();send(e.shiftKey?'new-space':'new-tab')}});
send('ready');
</script>
